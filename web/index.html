✒ Changelog:
    - 1.6.0 (11/13/2026) [dendogg + Anthropic - Claude Opus 5.5] —
      js/elsewhere.js, a classic script before the app, tells a page the
      service did not serve how to start Terrane. The altitude readout is
      no longer a live region and the status cell announces its state,
      not its counting figures. The lens names sit in spans so the
      narrow title block can show icons and keep the names; the ledger's
      rich panel and the inspector body take focus when a redraw removes
      the control that had it. The placing banner's buttons carry icons,
      and Cancel names its key; Find's example tokens are single-spaced,
      so the whole line fits the field at full width.
    - 1.5.0 (11/13/2026) [dendogg + Anthropic - Claude Opus 5.5] — An As
      of cell in the title block: a stepper for the date the world looks
      back to (earlier, the date or Now, later), reachable by Tab.
    - 1.4.0 (11/12/2026) [dendogg + Anthropic - Claude Opus 5.5] — The
      loading sheet's host, first in the body: the T is surveyed and laid
      down stratum by stratum while the service connects and the first
      survey arrives, then the sheet is excavated away.
    Earlier entries: see CHANGELOG.md

✒ Description:
    The single page of Terrane. It lays out the sheet around the world: the
    location bar, the ledger on the left, the 3D world in the middle with
    its instruments, the inspector on the right and the title block along
    the bottom. All behaviour is attached by web/js/app.js.

✒ Key Features:
    - Landmark structure (header, nav, main, complementary, footer) with a
      skip link, so the page is navigable without the 3D view
    - The ledger is a complete non-spatial alternative to the viewport
    - One host element each for the menu, dialog, tip and notices, which is
      how "one floating surface at a time" is enforced
    - Every icon-only control has an accessible name and a key hint
    - A polite live region announces selection and navigation changes;
      the status cell announces the service's state, never a figure
      while it counts
    - A loading sheet (#splash) covers the page until the first survey
      batch is drawn; it is its own polite status region and the regions
      beneath it are inert while it is up
    - No inline script: the session token is carried in a meta tag and the
      page runs under a strict content security policy; third-party code
      is vendored and served from this origin

✒ Other Important Information:
    - Dependencies: web/css/terrane.css, web/js/app.js,
      web/vendor/motion/motion.js, web/vendor/lucide/icons.svg
    - Compatible platforms: current Chrome, Edge, Firefox, Safari (WebGL2)
    - Security: the token placeholder in the meta tag is filled in by the
      service on each request. Opened from disk, from another server or
      from GitHub Pages, the page keeps the placeholder, and
      js/elsewhere.js says how to start the service instead
---------

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#f1f4f0">
  <meta name="description" content="Terrane: one directory as a world you travel through.">
  <meta name="terrane-token" content="__TERRANE_TOKEN__">
  <title>Terrane</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23f1f4f0'/%3E%3Crect x='2' y='21' width='28' height='8' fill='%2318201e'/%3E%3Crect x='7' y='13' width='18' height='8' fill='%2318201e'/%3E%3Crect x='11.5' y='5.5' width='9' height='7' fill='%23f4c430' stroke='%2318201e' stroke-width='1.5'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/terrane.css">
  <link rel="modulepreload" href="vendor/floating-ui/floating-ui.dom.browser.min.mjs">
  <link rel="modulepreload" href="vendor/floating-ui/floating-ui.core.browser.min.mjs">
  <script src="vendor/motion/motion.js" defer></script>
  <script src="js/elsewhere.js" defer></script>
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div id="splash" class="splash" role="status" aria-live="polite"></div>
  <a class="skip" href="#ledger-list">Skip to the ledger</a>

  <header id="bar">
    <div class="wordmark" aria-label="Terrane">
      <svg viewBox="0 0 28 20" width="28" height="20" aria-hidden="true">
        <rect id="mark-base" x="0" y="14" width="28" height="6"/>
        <rect id="mark-mid" x="5" y="8" width="17" height="6"/>
        <rect id="mark-top" x="10" y="2" width="7" height="6"/>
      </svg>
      <span>Terrane</span>
    </div>
    <nav id="crumbs" aria-label="Location"></nav>
    <div class="search" role="search">
      <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#search"/></svg>
      <label class="sr" for="q">Find in this directory</label>
      <input id="q" type="search" autocomplete="off" spellcheck="false"
             placeholder="Find · name *.psd ext:mp4 >50mb older:1y is:empty">
      <span id="q-count" aria-live="polite"></span>
      <kbd class="search-hint" aria-hidden="true">/</kbd>
      <button class="search-clear" id="q-clear" type="button" aria-label="Clear Find (Escape)" title="Clear (Escape)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#x"/></svg>
      </button>
    </div>
    <div class="bar-tools">
      <button class="btn" id="b-up" type="button" title="Up one level (Backspace)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#corner-left-up"/></svg><span class="label">Up</span>
      </button>
      <button class="btn" id="b-new" type="button" title="New folder here (N)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#folder-plus"/></svg><span class="label">New folder</span>
      </button>
      <button class="btn" id="b-undo" type="button" title="Undo last change (Ctrl+Z)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#undo-2"/></svg><span class="label">Undo</span>
      </button>
      <button class="btn" id="b-refresh" type="button" title="Re-read this folder from disk (F5)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#refresh-cw"/></svg><span class="label">Refresh</span>
      </button>
      <span class="sep" aria-hidden="true"></span>
      <button class="btn btn-raised" id="b-help" type="button" title="Keys and the visual language (?)">
        <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#book-open"/></svg><span class="label">Guide</span>
      </button>
    </div>
  </header>

  <main>
    <aside id="ledger" aria-label="Ledger">
      <div class="panel-head">
        <span class="ref">A</span>
        <!-- The tab buttons are made by app.js from its TABS registry. -->
        <div class="tabs" role="tablist" aria-label="Ledger views"></div>
      </div>
      <div id="ledger-sub" class="panel-sub"></div>
      <div id="ledger-list" class="ledger-body"></div>
      <div id="ledger-rich" class="ledger-body rich" tabindex="-1" hidden></div>
    </aside>

    <section id="stage" aria-label="3D world of the directory">
      <canvas id="view" tabindex="0"
              aria-label="3D world. W A S D to travel, arrow keys to move between items, Enter to go to a folder or open a file, Backspace to go up. The ledger lists the same items."></canvas>
      <div id="tags" aria-hidden="true"></div>
      <div class="frame" aria-hidden="true"><i></i><i></i><i></i><i></i></div>

      <div id="placing" hidden>
        <span id="placing-text"></span>
        <button class="btn btn-primary btn-small" id="placing-here" type="button">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#folder-input"/></svg>Place where I am</button>
        <button class="btn btn-small" id="placing-cancel" type="button" title="Cancel (Escape)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#x"/></svg>Cancel</button>
      </div>

      <div class="hud hud-north">
        <button class="north" id="north" type="button" aria-label="Turn to face north" title="Turn to face north">
          <svg viewBox="-20 -20 40 40" aria-hidden="true">
            <circle class="ring" r="16.5"/>
            <path class="needle-n" d="M0 -11 L4.5 0 L-4.5 0 Z"/>
            <path class="needle-s" d="M0 11 L4.5 0 L-4.5 0 Z"/>
            <text class="letter" x="0" y="-12.5">N</text>
          </svg>
        </button>
      </div>

      <div id="jobs" aria-label="Operations in progress"></div>
      <div class="hud hud-scale">
        <div class="scale" title="How much storage a square this size stands for at this height">
          <span class="scale-square" aria-hidden="true"></span>
          <span class="scale-text"><b id="scale-val">—</b><span class="caps">per square</span></span>
        </div>
      </div>

      <div class="view-tools" role="toolbar" aria-label="View">
        <button class="btn btn-icon" id="v-in" type="button" title="Fly closer (+)" aria-label="Fly closer">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#zoom-in"/></svg>
        </button>
        <button class="btn btn-icon" id="v-out" type="button" title="Pull back (−)" aria-label="Pull back">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#zoom-out"/></svg>
        </button>
        <span class="group-sep" aria-hidden="true"></span>
        <button class="btn btn-icon" id="v-left" type="button" title="Turn left (Q)" aria-label="Turn left">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#rotate-ccw"/></svg>
        </button>
        <button class="btn btn-icon" id="v-right" type="button" title="Turn right (E)" aria-label="Turn right">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#rotate-cw"/></svg>
        </button>
        <span class="group-sep" aria-hidden="true"></span>
        <button class="btn" id="v-down" type="button" title="Drop to eye level where you are looking (V)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#person-standing"/></svg><span class="label">Descend</span>
        </button>
        <button class="btn" id="v-go" type="button" title="Fly to the selection (G)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#locate-fixed"/></svg><span class="label">Go to selection</span>
        </button>
        <button class="btn" id="v-over" type="button" title="Rise to see everything (0)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#scan"/></svg><span class="label">Overview</span>
        </button>
        <span class="group-sep" aria-hidden="true"></span>
        <button class="btn btn-icon" id="v-ledger" type="button" title="Show or hide the ledger ([)" aria-label="Show or hide the ledger" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#panel-left"/></svg>
        </button>
        <button class="btn btn-icon" id="v-inspector" type="button" title="Show or hide the inspector (])" aria-label="Show or hide the inspector" aria-pressed="true">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#panel-right"/></svg>
        </button>
      </div>

      <div id="veil" hidden></div>
    </section>

    <aside id="inspector" aria-label="Inspector">
      <div class="panel-head"><span class="ref">B</span><h2>Inspector</h2></div>
      <div id="inspector-body" tabindex="-1"></div>
    </aside>
  </main>

  <footer id="block">
    <div class="cell">
      <span class="cell-label"><svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#eye"/></svg>Lens</span>
      <div class="seg" id="lens" role="radiogroup" aria-label="Colour lens">
        <button type="button" role="radio" data-lens="kind" aria-checked="true" title="Colour by kind (1)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#shapes"/></svg><span class="label">Kind</span></button>
        <button type="button" role="radio" data-lens="age" aria-checked="false" title="Colour by last change (2)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#history"/></svg><span class="label">Age</span></button>
        <button type="button" role="radio" data-lens="size" aria-checked="false" title="Colour by size (3)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#ruler-dimension-line"/></svg><span class="label">Size</span></button>
        <button type="button" role="radio" data-lens="dup" aria-checked="false" title="Show duplicate candidates (4)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#layers"/></svg><span class="label">Duplicates</span></button>
      </div>
    </div>
    <div class="cell cell-grow">
      <span class="cell-label" id="legend-label">Legend</span>
      <div id="legend"></div>
    </div>
    <div class="cell cell-time" id="time-cell">
      <span class="cell-label" id="time-label"><svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#calendar-clock"/></svg>As of</span>
      <div class="stepper" role="group" aria-labelledby="time-label">
        <button class="btn btn-small" id="time-earlier" type="button" aria-label="Earlier date (,)" title="Earlier date (,)">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#chevron-left"/></svg></button>
        <output id="time-val" aria-live="off" title="The date the world looks back to: T looks back, Escape returns to now">Now</output>
        <button class="btn btn-small" id="time-later" type="button" aria-label="Later date (.)" title="Later date (.)" aria-disabled="true">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#chevron-right"/></svg></button>
      </div>
    </div>
    <div class="cell">
      <span class="cell-label"><svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#scale"/></svg>Grain</span>
      <div class="stepper">
        <button class="btn btn-small" id="grain-less" type="button" aria-label="Coarser: fewer, larger blocks">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#minus"/></svg></button>
        <output id="grain-val">Medium</output>
        <button class="btn btn-small" id="grain-more" type="button" aria-label="Finer: more, smaller blocks">
          <svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#plus"/></svg></button>
      </div>
    </div>
    <div class="cell cell-alt">
      <span class="cell-label"><svg class="icon" aria-hidden="true"><use href="vendor/lucide/icons.svg#mountain"/></svg>Altitude</span>
      <output id="alt-val" class="readout" aria-live="off">Overview</output>
    </div>
    <div class="cell cell-status">
      <span class="cell-label" id="status-label" role="status">Status</span>
      <div id="status"></div>
    </div>
  </footer>

  <div id="menu" role="menu" hidden></div>
  <div id="tip" role="tooltip" hidden></div>
  <dialog id="dialog"></dialog>
  <div id="notices"></div>
  <div id="live" class="sr" aria-live="polite"></div>
</body>
</html>
