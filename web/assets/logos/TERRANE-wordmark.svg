✒ Changelog:
    - 1.1.0 (11/12/2026) [dendogg + Anthropic - Claude Opus 5.5] — No
      longer on the loading sheet: at Dennis's direction the framed
      wordmark (TERRANE-wordmark-framed.svg, from his TER.svg) took its
      place. Kept as the single-colour wordmark; nothing reads it now.
    - 1.0.0 (11/12/2026) [dendogg + Anthropic - Claude Opus 5.5] —
      Initial release.

✒ Description:
    The solid, single-colour TERRANE wordmark, for places a one-colour
    mark fits better than the framed one. The R and N are Dennis's
    drawings, placed exactly as drawn in web/assets/temp/R-N.svg and only
    translated onto a shared baseline. The T, E and A are the earlier
    drafts built from the R and N's own measurements; Dennis has since
    drawn his own T, E and R in TER.svg, which the framed wordmark uses.

✒ Key Features:
    - Cap height 399.527 (the R). The N is 399.14 tall and sits on the
      same baseline, 0.39 below the shared top line, as drawn.
    - Measurements the drafts borrow from the R: spine 126.476, top bar
      64.716, bowl right stroke 122.87, middle band 179.54 to 272.99,
      outer chamfers 27.38 by 27.91, counter slants 54.40 by 20.89.
    - T: 410 wide, bar 64.716, stem 126.476 centred.
    - E: 380 wide, spine 126.476, three 64.716 bars, the middle bar
      centred on the cap height and 40 shorter than the others.
    - A: the R's bowl made symmetric. Both shoulders chamfered, a
      counter with a slant at each top corner, the R's middle band as
      the crossbar, legs 126.476 and 122.87.
    - Spacing: 80 between letters, 30 under the T's overhang (T to E).
    - Colour: #5a97b7, the blue Dennis drew the R and N in, which sits
      between the T's light blue (#78b2cd) and dark blue (#34749a).
    - Naming: wordmark-terrane holds wordmark-letter-N-x, numbered in
      reading order (1-t to 7-e), one real path per visible letter.

✒ Usage Instructions:
    Use as a standalone single-colour asset. The loading sheet draws the
    framed wordmark instead (built by tools/build_terrane_wordmark.py),
    so editing this file changes nothing in the app. Keep the baseline
    at y = 399.527 and the cap line at y = 0.

✒ Other Important Information:
    - Dependencies: none to render; nothing in the build reads it
    - Compatible platforms: Inkscape 1.4+, current browsers, any SVG 1.1
      renderer
    - Page: fitted to the letters with no margin, Inkscape stock page
      and desk colours
-->
