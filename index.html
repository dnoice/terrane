✒ Description:
    The page GitHub Pages serves at the repository root. It sends the
    visitor straight on to the interface in web/, so the interface has one
    page and one copy to maintain.

✒ Key Features:
    - Forwards to web/ at once, keeping the query string and fragment
    - A plain link to the same place where forwarding is blocked
    - Not served by the Terrane service, which serves only web/

✒ Usage Instructions:
    GitHub Pages: Settings, Pages, Deploy from a branch, main, / (root).
    The site then opens on this page and continues to web/index.html.

✒ Other Important Information:
    - Dependencies: none; the root .nojekyll file makes Pages serve the
      repository as it is, without a Jekyll build
    - Compatible platforms: any browser
    - Limitations: a static host has no service, so the interface runs
      its demo world there (web/js/demo.js); a visitor's own directory
      needs the local service that npm start launches
